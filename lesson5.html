<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lesson 5</title>
  </head>
  <body>
    <table>
      <caption>
        Employee Information
      </caption>
      <thead>
        <tr>
          <th>Name</th>
          <th>Position</th>
          <th>Department</th>
          <th>Salary</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>John Doe</td>
          <td>Web Developer</td>
          <td>Development</td>
          <td>$60000</td>
        </tr>
        <tr>
          <td>Michael Jackson</td>
          <td>Artist</td>
          <td>Entertainment</td>
          <td>$160000</td>
        </tr>
        <tr>
          <td>Mary Johnson</td>
          <td>Project Manager</td>
          <td>Management</td>
          <td>$85,000</td>
        </tr>
        <tr>
            <td colspan="2">Total</td>
            <td>All Departments</td>
            <td rowspan="2">$220,000</td>
        </tr>
        <tr>
            <td colspan="2">Average Salary</td>
            <td>All Department</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
